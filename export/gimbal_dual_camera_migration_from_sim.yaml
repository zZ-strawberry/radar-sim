# 从 radar-sim（radar_gimbal_gazebo）导出的双相机云台迁移数据
# 生成依据：radar_gimbal_gazebo/urdf/radar_gimbal.urdf.xacro + serial_comm.py 注释
# 约定：短焦 = fixed_camera 光学系 camera_one_optical_Link
#       长焦 = gimbal_camera 光学系 camera_tow_optical_Link
# 初始位姿：yaw_joint=0、pitch_joint=0（与上位机 roll=0°、pitch=0° 对齐）
#
# 距离假设：目标常在 15–28 m；无测距时按「无穷远射线方向」回指，视差误差约
#   atan(baseline/Z) ≈ 0.29°–0.54°（见下文 parallax_error_deg）

metadata:
  source_repo: radar-sim
  source_files:
    - radar_gimbal_gazebo/urdf/radar_gimbal.urdf.xacro
    - serial_comm.py
  urdf_joint_names:
    azimuth: yaw_joint
    elevation: pitch_joint
  note: >-
    上位机协议字段名为 pitch/roll；与仿真关节语义对应关系为：
    roll ↔ yaw_joint（绕 +Z，roll>0 向左转），pitch ↔ pitch_joint（绕 -Y，pitch>0 上仰）。
    与 serial_comm.py 中角度定义一致。

sufficiency_for_no_range:
  target_distance_m_typical: [15, 28]
  assessment: sufficient_for_direction_repointing
  rationale: >-
    两光轴在初始位姿下平行（T_short_to_long 旋转为单位阵），基线约 0.14 m。
    在 15–28 m 上由基线引起的方向误差约 0.29°–0.54°，通常足以把目标带回窄视场长焦；
    若长焦极窄或要求像素级中心对准，可再引入粗略距离或闭环微调。

# 光学系：OpenCV / ROS 常用 camera optical frame
# +Z 前、+X 右、+Y 下（与 URDF 中 optical link 装配一致）
frames:
  base_link: base_link
  fixed_short_optical: camera_one_optical_Link
  gimbal_long_optical: camera_tow_optical_Link
  initial_joint_state_rad:
    yaw_joint: 0.0
    pitch_joint: 0.0

# 初始位姿下：短焦光学系 → 长焦光学系
# 语义：p_in_short = T_short_to_long * p_in_long（齐次坐标）
# 当前数值下 R=I，仅平移（两相机光轴平行）
T_short_to_long:
  layout: row_major_4x4
  matrix:
    - [1.0, 0.0, 0.0, -0.11299997302332859]
    - [0.0, 1.0, 0.0, -0.0863]
    - [0.0, 0.0, 1.0, -0.001900150929141406]
    - [0.0, 0.0, 0.0, 1.0]
  rotation_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
  translation_m:
    x: -0.11299997302332859
    y: -0.0863
    z: -0.001900150929141406

# 光心在 base_link 下的位置（米），便于核对基线
optical_center_position_base_link_m:
  camera_one_optical_Link:
    x: 0.06437406140126439
    y: 0.0638829730233286
    z: 0.0175
  camera_tow_optical_Link:
    x: 0.0662742123304058
    y: -0.049117
    z: 0.1038

baseline_m:
  optical_centers_euclidean: 0.14219808183244423
  note: 初始位姿下两光学中心三维距离

parallax_error_deg:
  formula: atan(baseline_m / distance_m) in degrees
  at_distance_m:
    "15": 0.5431403930043918
    "28": 0.29097428220179006

# URDF 关节轴（父连杆坐标系下），与上位机 roll/pitch 正方向一致时可不取反
joint_axes_parent_frame:
  yaw_joint:
    parent_link: base_link
    child_link: yaw_joint_Link
    axis_xyz: [0, 0, 1]
    limit_rad: { lower: -3.14159, upper: 3.14159 }
  pitch_joint:
    parent_link: yaw_joint_Link
    child_link: pich_joint_Link
    axis_xyz: [0, -1, 0]
    limit_rad: { lower: -1.2, upper: 1.2 }

host_to_urdf_mapping:
  host_pitch_deg: urdf_pitch_joint_deg
  host_roll_deg: urdf_yaw_joint_deg
  sign_check: matches_serial_comm_and_urdf

# 下位机串口（见 serial_comm.py；若下位机已改帧格式，仅保留本字段语义）
serial_downlink:
  endian: little
  mode_8byte:
    struct_format: "<ff"
    fields_order: [pitch_deg, roll_deg]
    types: [float32, float32]
  mode_16byte_recommended:
    struct_format: "<ffff"
    fields_order: [pitch_deg, roll_deg, v_pitch_deg_s, v_roll_deg_s]
    types: [float32, float32, float32, float32]
  angle_semantics:
    pitch_deg_gt_0: gimbal_nose_up
    pitch_deg_lt_0: gimbal_nose_down
    roll_deg_gt_0: gimbal_turn_left
    roll_deg_lt_0: gimbal_turn_right
  angle_reference: absolute_relative_to_program_start_initial_pose
  estimated_cmd_to_motion_latency_ms: 25

# 上位机侧限位（URDF 为机械极限；你方软件向左转限制请填在自建配置里）
host_software_limits:
  roll_left_limit_deg: null  # TODO: 填入你上位机手动设置的向左转限制

# Gazebo 仿真相机名义参数（真机请用标定 K/D 替换）
simulation_camera_nominal:
  both_cameras:
    horizontal_fov_rad: 1.047
    horizontal_fov_deg: 59.988002044136175
    image_width_px: 1280
    image_height_px: 720
    clip_near_m: 0.05
    clip_far_m: 100.0
  ros_topics_gazebo_default:
    fixed_short:
      image: /fixed_camera/image_raw
      camera_info: /fixed_camera/camera_info
      frame_id: camera_one_optical_Link
    gimbal_long:
      image: /gimbal_camera/image_raw
      camera_info: /gimbal_camera/camera_info
      frame_id: camera_tow_optical_Link

# 真机迁移时必须自行填入或替换（本仓库不包含标定文件）
real_hardware_calibration:
  fixed_short_intrinsics_K: null
  fixed_short_distortion_D: null
  gimbal_long_intrinsics_K: null
  gimbal_long_distortion_D: null
  note: 仿真仅提供 FOV 与分辨率；真机闭环以标定为准

# URDF 中固定相机与云台链相对 base_link 的静态关节平移+旋转（供自建 TF 或核对）
urdf_static_transforms_summary:
  base_link_to_fix_camera_one_Link:
    xyz_m: [0.030847222837753, 0.0638829730233286, 0.0175]
    rpy_rad: [0, 0, 0]
  fix_camera_one_Link_to_camera_one_optical_Link:
    xyz_m: [0.0335268385635114, 0, 0]
    rpy_rad: [-1.5707963267949, 0, 1.5707963267949]
  base_link_to_yaw_joint_Link_at_zero:
    xyz_m: [0, -0.047117, 0.0405]
    rpy_rad: [0, 0, 0]
  yaw_joint_Link_to_pich_joint_Link_at_zero:
    xyz_m: [0, -0.003, 0.031]
    rpy_rad: [0, 0, 0]
  pich_joint_Link_to_movable_camera_tow_Link:
    xyz_m: [0.03085, 0.001, 0.0323]
    rpy_rad: [0, 0, 0]
  movable_camera_tow_Link_to_camera_tow_optical_Link:
    xyz_m: [0.0354242123304058, 0, 0]
    rpy_rad: [-1.5707963267949, 0, 1.5707963267949]
